services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioimages-app
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5433
      DB_NAME: bioimages
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: bioimages-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,Z
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - app

  postgres:
    image: postgres:16
    container_name: bioimages-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bioimages
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioimages"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
