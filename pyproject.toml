[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioimages-2026"
version = "0.1.0"
description = "Bioimages ETL and API project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "pydicom>=2.4.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "minio>=7.2.0",
    "streamlit>=1.35.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "scikit-image==0.22.0",
    "matplotlib==3.8.4",
    "pillow>=10.0.0",
    "SimpleITK==2.3.1",
    "pyradiomics==3.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
